x-airflow: &airflow
  build: .
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow
    DATA_DIR: /opt/airflow/data
    SFTP_LOCAL_DIR: /opt/airflow/sftp_data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./sftp_data:/opt/airflow/sftp_data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # ---------- Airflow ----------
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    depends_on:
      airflow-db: { condition: service_healthy }
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
          airflow users create --username admin --password admin
          --firstname a --lastname b --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # ---------- Data sources ----------
  source-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${SRC_PG_USER}
      POSTGRES_PASSWORD: ${SRC_PG_PASSWORD}
      POSTGRES_DB: ${SRC_PG_DB}
    volumes:
      - ./init/postgres_seed.sql:/docker-entrypoint-initdb.d/seed.sql

  mongo:
    image: mongo:7
    volumes:
      - ./init/mongo_seed.js:/docker-entrypoint-initdb.d/seed.js

  sftp:
    image: atmoz/sftp
    command: ${SFTP_USER}:${SFTP_PASSWORD}:::upload
    volumes:
      - ./sftp_data:/home/${SFTP_USER}/upload
